name: Kanal listesini güncelle

on:
  schedule:
    - cron: '17 3 * * 1'   # her pazartesi 06:17 (TSİ)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: iptv-org verilerini al
        run: |
          git clone -q --depth 1 https://github.com/iptv-org/iptv /tmp/iptv
          git clone -q --depth 1 https://github.com/iptv-org/database /tmp/db
      - name: Listeyi üret
        run: python3 tools/build_playlist.py /tmp/iptv /tmp/db playlists
      - name: Değişiklik varsa gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add playlists
          git diff --cached --quiet || (git commit -qm "Kanal listesi güncellendi" && git push)
